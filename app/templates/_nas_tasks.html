<div class="mt-4 space-y-4">
  <!-- SD -> NVMe backup preset -->
  <div class="rounded-lg bg-white p-4 shadow">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div>
        <h3 class="font-semibold text-gray-700">{{locales.backup_title}}</h3>
        <p class="text-xs text-gray-400">{{locales.backup_desc}}</p>
        <p x-show="backup.ready" class="mt-1 font-mono text-xs text-gray-400">
          <span x-text="backup.sd && backup.sd.mountpoint"></span> →
          <span x-text="backup.dest"></span>
        </p>
        <p x-show="backup.ready === false" class="mt-1 text-xs text-yellow-700">{{locales.backup_not_ready}}</p>
      </div>
      <button @click="runBackup()" :disabled="!backup.ready"
        class="rounded bg-pcatblue px-3 py-1 text-sm text-white disabled:opacity-40">{{locales.backup_run}}</button>
    </div>
  </div>

  <!-- scheduled sync jobs -->
  <div class="rounded-lg bg-white p-4 shadow">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold text-gray-700">{{locales.sync_title}}</h3>
      <button @click="openSyncEdit(null)" class="rounded bg-pcatblue px-3 py-1 text-sm text-white">{{locales.sync_add}}</button>
    </div>
    <div x-show="!syncJobs.length" class="mt-3 text-center text-sm text-gray-400">{{locales.sync_no_jobs}}</div>
    <div class="mt-2 space-y-2">
      <template x-for="job in syncJobs" :key="job.id">
        <div class="flex flex-wrap items-center justify-between gap-2 rounded border border-gray-100 p-3">
          <div class="min-w-0">
            <div class="text-sm font-medium text-gray-700">
              <span x-text="job.name"></span>
              <span class="ml-1 rounded bg-gray-100 px-2 py-0.5 text-xs text-gray-500" x-text="job.schedule"></span>
              <span x-show="!job.enabled" class="ml-1 text-xs text-gray-400">({{locales.remotes_state_disabled}})</span>
            </div>
            <div class="truncate font-mono text-xs text-gray-400">
              <span x-text="job.src"></span> → <span x-text="job.dst"></span>
            </div>
          </div>
          <div class="flex flex-wrap gap-1">
            <button @click="syncAction(job, 'run_now')" class="rounded bg-pcatblue px-2 py-1 text-xs text-white">{{locales.sync_run_now}}</button>
            <button @click="showSyncLog(job)" class="rounded border border-gray-300 px-2 py-1 text-xs text-gray-600 hover:bg-gray-50">{{locales.sync_log}}</button>
            <button @click="openSyncEdit(job)" class="rounded border border-gray-300 px-2 py-1 text-xs text-gray-600 hover:bg-gray-50">{{locales.shares_edit}}</button>
            <button @click="syncAction(job, 'delete')" class="rounded border border-red-300 px-2 py-1 text-xs text-red-600 hover:bg-red-50">{{locales.shares_btn_delete}}</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div x-show="!jobList().length" class="rounded-lg bg-white p-6 text-center text-gray-400 shadow">{{locales.tasks_no_jobs}}</div>
  <div class="space-y-2">
    <template x-for="job in jobList()" :key="job.id">
      <div class="rounded-lg bg-white p-4 shadow">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <div class="text-sm font-medium text-gray-700" x-text="jobLabel(job)"></div>
            <div class="text-xs text-gray-400">
              <span x-text="job.kind"></span>
              <span class="mx-1">·</span>
              <span :class="job.state == 'error' ? 'text-red-500' : job.state == 'done' ? 'text-green-600' : 'text-pcatblue'" x-text="job.state"></span>
              <span x-show="job.error" class="text-red-500" x-text="' — ' + job.error"></span>
            </div>
          </div>
          <div class="flex gap-2">
            <button x-show="(job.state == 'running' || job.state == 'queued') && job.cancellable"
              @click="jobAction(job.id, 'cancel')"
              class="rounded border border-gray-300 px-3 py-1 text-xs text-gray-600 hover:bg-gray-50">{{locales.tasks_btn_cancel}}</button>
            <button x-show="job.state != 'running' && job.state != 'queued'"
              @click="jobAction(job.id, 'dismiss')"
              class="rounded border border-gray-300 px-3 py-1 text-xs text-gray-400 hover:bg-gray-50">{{locales.tasks_btn_dismiss}}</button>
          </div>
        </div>
        <div x-show="job.state == 'running'" class="mt-2">
          <div class="h-2 overflow-hidden rounded bg-gray-200">
            <div class="h-full bg-pcatblue transition-all" :style="'width:' + (job.pct === null ? 100 : job.pct) + '%'"
              :class="job.pct === null ? 'animate-pulse' : ''"></div>
          </div>
          <div class="mt-1 flex justify-between text-xs text-gray-400">
            <span x-text="job.message"></span>
            <span x-show="job.bytes_total" x-text="nasFormatSize(job.bytes_done) + ' / ' + nasFormatSize(job.bytes_total)"></span>
          </div>
        </div>
        <div x-show="job.log_tail && job.log_tail.length && job.state != 'done'" class="mt-2 max-h-24 overflow-y-auto rounded bg-gray-900 p-2 font-mono text-xs text-green-400">
          <template x-for="(line, i) in job.log_tail" :key="i"><div x-text="line"></div></template>
        </div>
      </div>
    </template>
  </div>

  <!-- sync job editor -->
  <div x-show="syncEdit.open" x-cloak class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="syncEdit.open = false">
    <div class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-lg bg-white p-5 shadow-xl">
      <h3 class="font-bold text-gray-700" x-text="syncEdit.id ? '{{locales.sync_edit}}' : '{{locales.sync_add}}'"></h3>
      <div class="mt-3 space-y-3 text-sm">
        <div>
          <label class="mb-1 block text-gray-500">{{locales.sync_name}}</label>
          <input x-model="syncEdit.name" class="w-full rounded border border-gray-300 px-2 py-1" />
        </div>
        <div>
          <label class="mb-1 block text-gray-500">{{locales.sync_src}}</label>
          <div class="flex gap-2">
            <input x-model="syncEdit.src" class="flex-1 rounded border border-gray-300 px-2 py-1 font-mono text-xs" />
            <button @click="pickSyncPath('src')" class="rounded border border-gray-300 px-3 py-1 text-gray-600 hover:bg-gray-50">{{locales.shares_choose}}</button>
          </div>
        </div>
        <div>
          <label class="mb-1 block text-gray-500">{{locales.sync_dst}}</label>
          <div class="flex gap-2">
            <input x-model="syncEdit.dst" class="flex-1 rounded border border-gray-300 px-2 py-1 font-mono text-xs" />
            <button @click="pickSyncPath('dst')" class="rounded border border-gray-300 px-3 py-1 text-gray-600 hover:bg-gray-50">{{locales.shares_choose}}</button>
          </div>
        </div>
        <div>
          <label class="mb-1 block text-gray-500">{{locales.sync_schedule}}</label>
          <select x-model="syncEdit.schedule" class="w-full rounded border border-gray-300 px-2 py-1">
            <option value="hourly">{{locales.sync_hourly}}</option>
            <option value="daily">{{locales.sync_daily}}</option>
            <option value="weekly">{{locales.sync_weekly}}</option>
            <option value="cron">{{locales.sync_custom}}</option>
          </select>
        </div>
        <div x-show="syncEdit.schedule == 'cron'">
          <input x-model="syncEdit.cron" placeholder="*/10 * * * *" class="w-full rounded border border-gray-300 px-2 py-1 font-mono text-xs" />
        </div>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="syncEdit.delete" class="rounded" /> <span class="text-xs">{{locales.sync_delete_extra}}</span></label>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="syncEdit.enabled" class="rounded" /> {{locales.sync_enabled}}</label>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button @click="syncEdit.open = false" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-600">{{locales.shares_btn_cancel}}</button>
        <button @click="saveSyncJob()" class="rounded bg-pcatblue px-4 py-2 text-sm text-white">{{locales.shares_btn_save}}</button>
      </div>
    </div>
  </div>

  <!-- log viewer -->
  <div x-show="logModal.open" x-cloak class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="logModal.open = false">
    <div class="flex max-h-[80vh] w-full max-w-2xl flex-col rounded-lg bg-white p-5 shadow-xl">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-gray-700"><span x-text="logModal.title"></span> — {{locales.sync_log}}</h3>
        <button @click="logModal.open = false" class="text-2xl leading-none text-gray-400">&times;</button>
      </div>
      <pre class="mt-3 flex-1 overflow-auto rounded bg-gray-900 p-3 font-mono text-xs text-green-400" x-text="logModal.text"></pre>
    </div>
  </div>
</div>
