<div>
  <!-- No volumes (disks panel with the mount buttons sits right beside) -->
  <template x-if="!path && !volumes.length && !filesLoading">
    <div class="rounded-lg bg-white p-6 text-center shadow">
      <p class="text-gray-500">{{locales.files_no_volumes}}</p>
    </div>
  </template>

  <!-- Volume list (root) -->
  <template x-if="!path && volumes.length">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <template x-for="vol in volumes" :key="vol.mountpoint">
        <button @click="loadFiles(vol.mountpoint)" class="rounded-lg bg-white p-4 text-left shadow hover:shadow-md">
          <div class="flex items-center gap-3">
            <img src="/static/nas.svg" class="h-6 w-6" />
            <div>
              <div class="font-semibold text-gray-700" x-text="vol.name"></div>
              <div class="text-xs text-gray-400">
                <span x-text="nasFormatSize(vol.free_bytes)"></span> {{locales.files_free}} /
                <span x-text="nasFormatSize(vol.total_bytes)"></span>
              </div>
            </div>
          </div>
        </button>
      </template>
    </div>
  </template>

  <!-- Browser -->
  <template x-if="path">
    <div class="rounded-lg bg-white shadow"
         @dragover.prevent="dropActive = true" @dragleave.prevent="dropActive = false"
         @drop.prevent="dropActive = false; handleDrop($event)"
         @click="closeRowMenu()"
         x-data="{ dropActive: false }"
         :class="dropActive ? 'ring-2 ring-pcatblue' : ''">

      <!-- Toolbar -->
      <div class="flex flex-wrap items-center gap-2 border-b border-gray-100 p-3">
        <button @click="loadFiles('')" class="rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-50">⌂</button>
        <template x-for="c in crumbs()" :key="c.path">
          <span class="flex items-center gap-1 text-sm">
            <span class="text-gray-300">/</span>
            <button @click="loadFiles(c.path)" class="text-pcatblue hover:underline" x-text="c.name"></button>
          </span>
        </template>
        <span class="flex-1"></span>
        <label class="cursor-pointer rounded bg-pcatblue px-3 py-1 text-sm text-white">
          {{locales.files_btn_upload}}
          <input type="file" multiple class="hidden" @change="handleFileInput($event)" />
        </label>
        <label class="cursor-pointer rounded border border-gray-300 px-3 py-1 text-sm text-gray-600 hover:bg-gray-50">
          {{locales.files_btn_upload_folder}}
          <input type="file" webkitdirectory class="hidden" @change="handleFileInput($event)" />
        </label>
        <button @click="newFolderOpen = !newFolderOpen" class="rounded border border-gray-300 px-3 py-1 text-sm text-gray-600 hover:bg-gray-50">{{locales.files_btn_new_folder}}</button>
        <button @click="loadFiles(path)" class="rounded border border-gray-300 px-3 py-1 text-sm text-gray-600 hover:bg-gray-50">{{locales.files_btn_refresh}}</button>
      </div>

      <!-- Selection toolbar -->
      <div x-show="selection.length || clipboard.paths.length" class="flex flex-wrap items-center gap-2 border-b border-gray-100 bg-gray-50 p-2 text-sm">
        <span class="px-1 text-gray-500" x-text="selection.length"></span>
        <button x-show="selection.length" @click="downloadSelected()" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-white">{{locales.files_btn_download}}</button>
        <button x-show="selection.length == 1" @click="startRename()" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-white">{{locales.files_btn_rename}}</button>
        <button x-show="selection.length == 1" @click="openLinkModal()" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-white">🔗 {{locales.link_btn}}</button>
        <button x-show="selection.length" @click="setClipboard('copy')" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-white">{{locales.files_btn_copy}}</button>
        <button x-show="selection.length" @click="setClipboard('move')" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-white">{{locales.files_btn_move}}</button>
        <button x-show="clipboard.paths.length" @click="pasteClipboard()" class="rounded bg-pcatblue px-2 py-1 text-white">
          {{locales.files_btn_paste}} (<span x-text="clipboard.paths.length"></span>)
        </button>
        <button x-show="selection.length" @click="deleteSelected()" class="rounded border border-red-300 px-2 py-1 text-red-600 hover:bg-red-50">{{locales.files_btn_delete}}</button>
      </div>

      <!-- New folder inline -->
      <div x-show="newFolderOpen" class="flex items-center gap-2 border-b border-gray-100 p-2">
        <input x-model="newFolderName" @keydown.enter="mkFolder()" placeholder="{{locales.files_new_folder_name}}"
          class="rounded border border-gray-300 px-2 py-1 text-sm" />
        <button @click="mkFolder()" class="rounded bg-pcatblue px-3 py-1 text-sm text-white">{{locales.shares_btn_save}}</button>
      </div>

      <!-- Upload queue -->
      <div x-show="upload.queue.length" class="border-b border-gray-100 p-2">
        <div class="mb-1 text-xs text-gray-500" x-text="uploadTotals()"></div>
        <div class="max-h-40 space-y-1 overflow-y-auto">
          <template x-for="(item, idx) in upload.queue" :key="idx">
            <div class="flex items-center gap-2 text-xs">
              <span class="w-40 truncate text-gray-600 sm:w-64" x-text="item.rel"></span>
              <div class="h-2 flex-1 overflow-hidden rounded bg-gray-200">
                <div class="h-full bg-pcatblue transition-all" :style="'width:' + item.pct + '%'"
                  :class="item.state == 'error' ? 'bg-red-500' : ''"></div>
              </div>
              <span class="w-10 text-right text-gray-400" x-text="item.state == 'error' ? '✗' : item.pct + '%'"></span>
            </div>
          </template>
        </div>
      </div>

      <!-- Listing -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-xs uppercase text-gray-400">
              <th class="w-8 p-2"></th>
              <th class="p-2">{{locales.files_col_name}}</th>
              <th class="hidden w-20 p-2 sm:table-cell">{{locales.files_col_size}}</th>
              <th class="hidden p-2 md:table-cell" style="width: 9.5rem; min-width: 9.5rem">{{locales.files_col_modified}}</th>
              <th class="w-12 p-2 text-right"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(entry, idx) in entries" :key="entry.name">
              <tr class="border-t border-gray-100 hover:bg-gray-50">
                <td class="p-2">
                  <input type="checkbox" :checked="selection.includes(entry.name)"
                    @click="toggleSelect(entry, idx, $event)" class="rounded" />
                </td>
                <td class="p-2">
                  <template x-if="renaming == entry.name">
                    <input id="nas-rename-input" x-model="renameValue" @keydown.enter="commitRename()"
                      @keydown.escape="renaming = ''" @blur="commitRename()"
                      class="rounded border border-pcatblue px-1 py-0.5 text-sm" />
                  </template>
                  <template x-if="renaming != entry.name">
                    <button type="button" @click="navigate(entry)" class="flex max-w-full items-center gap-2 text-left"
                      :class="entry.type == 'dir' ? 'font-medium text-pcatblue' : (fileKind(entry.name) ? 'text-pcatblue hover:underline' : 'text-gray-700')"
                      :title="entry.type == 'file' && fileKind(entry.name) ? '{{locales.files_preview_hint}}' : ''">
                      <span x-text="fileIcon(entry)"></span>
                      <span class="truncate" x-text="entry.name"></span>
                      <span x-show="entry.symlink" class="text-xs text-gray-400">→</span>
                      <span x-show="linksFor(entry.name).length" class="ml-1 text-xs text-gray-400" title="{{locales.link_btn}}">🔗</span>
                    </button>
                  </template>
                </td>
                <td class="hidden w-20 whitespace-nowrap p-2 text-gray-400 sm:table-cell" x-text="entry.type == 'file' ? nasFormatSize(entry.size) : ''"></td>
                <td class="hidden whitespace-nowrap p-2 md:table-cell" style="width: 9.5rem; min-width: 9.5rem"
                  :title="nasFormatTime(entry.mtime)">
                  <div class="font-mono text-xs text-gray-500" x-text="nasFormatTimeYMD(entry.mtime)"></div>
                  <div class="text-xs text-gray-400" x-text="nasFormatTimeAgo(entry.mtime)"></div>
                </td>
                <td class="relative p-1 text-right">
                  <!-- Vertical ⋯ menu: share / download / copy / move / … -->
                  <button type="button" @click.stop="toggleRowMenu(entry.name)"
                    class="inline-flex h-8 w-8 items-center justify-center rounded text-gray-500 hover:bg-gray-100 hover:text-gray-800"
                    :class="rowMenu == entry.name ? 'bg-gray-100 text-gray-800' : ''"
                    title="{{locales.files_btn_more}}" aria-label="{{locales.files_btn_more}}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M10 6a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 5.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM10 17a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
                    </svg>
                  </button>
                  <div x-show="rowMenu == entry.name" x-cloak @click.stop
                    class="absolute right-0 z-20 mt-0.5 w-48 origin-top-right rounded-md border border-gray-200 bg-white py-1 text-left shadow-lg">
                    <button type="button" x-show="entry.type == 'file' && fileKind(entry.name)"
                      @click="rowMenuAction(entry, 'preview')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">{{locales.files_btn_preview}}</button>
                    <button type="button" x-show="entry.type == 'file'"
                      @click="rowMenuAction(entry, 'download')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">{{locales.files_btn_download}}</button>
                    <button type="button" @click="rowMenuAction(entry, 'share')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">
                      🔗 {{locales.link_btn}}
                      <span class="block text-xs font-normal text-gray-400">{{locales.link_menu_hint}}</span>
                    </button>
                    <div class="my-1 border-t border-gray-100"></div>
                    <button type="button" @click="rowMenuAction(entry, 'rename')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">{{locales.files_btn_rename}}</button>
                    <button type="button" @click="rowMenuAction(entry, 'copy')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">{{locales.files_btn_copy}}</button>
                    <button type="button" @click="rowMenuAction(entry, 'move')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">{{locales.files_btn_move}}</button>
                    <div class="my-1 border-t border-gray-100"></div>
                    <button type="button" @click="rowMenuAction(entry, 'delete')"
                      class="block w-full px-3 py-1.5 text-left text-sm text-red-600 hover:bg-red-50">{{locales.files_btn_delete}}</button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="!entries.length && !filesLoading">
              <td colspan="5" class="p-6 text-center text-gray-400">{{locales.files_empty_dir}}<br />
                <span class="text-xs">{{locales.files_drop_hint}}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Media / file preview modal -->
  <div x-show="preview.open" x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-3 sm:p-6"
    @keydown.escape.window="closePreview()"
    @keydown.arrow-left.window="previewNav(-1)"
    @keydown.arrow-right.window="previewNav(1)"
    @click.self="closePreview()">
    <div class="flex max-h-full w-full max-w-5xl flex-col overflow-hidden rounded-lg bg-white shadow-xl"
      @click.stop>
      <div class="flex items-center gap-2 border-b border-gray-100 px-3 py-2">
        <div class="min-w-0 flex-1 truncate font-medium text-gray-700" x-text="preview.name"></div>
        <button type="button" @click="previewNav(-1)" :disabled="!previewHasPrev()"
          class="rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-50 disabled:opacity-30"
          title="{{locales.files_preview_prev}}">‹</button>
        <button type="button" @click="previewNav(1)" :disabled="!previewHasNext()"
          class="rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-50 disabled:opacity-30"
          title="{{locales.files_preview_next}}">›</button>
        <a :href="previewDownloadUrl()" class="inline-flex items-center gap-1 rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-50"
          title="{{locales.files_btn_download}}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12l4.5 4.5m0 0l4.5-4.5M12 16.5V3" />
          </svg>
          <span class="hidden sm:inline">{{locales.files_btn_download}}</span>
        </a>
        <button type="button" @click="closePreview()"
          class="rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-50">{{locales.files_preview_close}}</button>
      </div>
      <div class="flex min-h-0 flex-1 items-center justify-center overflow-auto bg-gray-900 p-2 sm:p-4" style="max-height: min(80vh, 720px)">
        <template x-if="preview.open && preview.kind == 'image'">
          <img :key="preview.path" :src="previewInlineUrl()" :alt="preview.name"
            class="max-h-[min(75vh,680px)] max-w-full object-contain" />
        </template>
        <template x-if="preview.open && preview.kind == 'video'">
          <video :key="preview.path" :src="previewInlineUrl()" controls autoplay playsinline
            class="max-h-[min(75vh,680px)] max-w-full bg-black"></video>
        </template>
        <template x-if="preview.open && preview.kind == 'audio'">
          <div class="w-full max-w-lg rounded-lg bg-gray-800 p-6 text-center text-white">
            <div class="mb-4 truncate text-sm text-gray-300" x-text="preview.name"></div>
            <audio :key="preview.path" :src="previewInlineUrl()" controls autoplay class="w-full"></audio>
          </div>
        </template>
        <template x-if="preview.open && preview.kind == 'pdf'">
          <iframe :key="preview.path" :src="previewInlineUrl()" class="h-[min(75vh,680px)] w-full rounded bg-white" title="PDF"></iframe>
        </template>
      </div>
    </div>
  </div>
</div>
