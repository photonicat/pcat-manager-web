<div x-show="linkModal.open" x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4"
  @click.self="linkModal.open = false">
  <div class="w-full max-w-md rounded-lg bg-white p-5 shadow-xl" @click.stop>
    <div class="flex items-center justify-between">
      <h3 class="font-bold text-gray-700">{{locales.link_title}}</h3>
      <button type="button" @click="linkModal.open = false" class="text-2xl leading-none text-gray-400">&times;</button>
    </div>

    <!-- Create: password + button only -->
    <div x-show="!activeShareLink()" class="mt-4 space-y-3 text-sm">
      <div>
        <label class="mb-1 block text-xs text-gray-500">{{locales.link_password_opt}}</label>
        <input type="password" x-model="linkModal.password" autocomplete="new-password"
          placeholder="{{locales.link_password_ph}}"
          class="w-full rounded border border-gray-300 px-2 py-1.5" />
      </div>
      <button type="button" @click="createLink()" :disabled="linkModal.busy"
        class="w-full rounded bg-pcatblue px-4 py-2 text-white disabled:opacity-50">{{locales.link_create}}</button>
    </div>

    <!-- Result: URL + Copy only -->
    <div x-show="activeShareLink()" class="mt-4">
      <div class="flex items-stretch gap-2">
        <input readonly :value="activeShareLink() ? linkUrl(activeShareLink()) : ''"
          class="min-w-0 flex-1 rounded border border-gray-300 bg-gray-50 px-2 py-2 font-mono text-xs transition-colors duration-150"
          :class="linkModal.flash ? 'bg-green-100 border-green-400 text-green-800' : ''"
          @click="$event.target.select()" />
        <button type="button" @click="copyLink(activeShareLink())"
          class="min-w-[4.5rem] rounded px-3 py-2 text-sm font-medium transition-colors duration-150"
          :class="linkModal.flash ? 'bg-green-500 text-white' : 'bg-pcatblue text-white'">
          <span x-text="linkModal.flash ? '{{locales.link_copied}}' : '{{locales.link_copy}}'"></span>
        </button>
      </div>
      <div class="mt-2 flex items-center justify-between text-xs text-gray-400">
        <span x-show="activeShareLink() && activeShareLink().has_password">🔒 {{locales.link_protected}}</span>
        <button type="button" x-show="activeShareLink()" @click="deleteLink(activeShareLink())"
          class="text-red-500 hover:underline">{{locales.link_delete}}</button>
      </div>
    </div>
  </div>
</div>
