<div class="mt-4 space-y-4">
  <!-- HTTP share links (from file ⋯ → Share via HTTP) — always listed here -->
  <div class="rounded-lg bg-white p-4 shadow">
    <div>
      <h3 class="font-semibold text-gray-700">{{locales.link_title}}</h3>
      <p class="mt-0.5 text-xs text-gray-400">{{locales.link_list_help}}</p>
    </div>
    <div x-show="!links.length" class="mt-4 text-center text-sm text-gray-400">{{locales.link_none}}</div>
    <div class="mt-3 space-y-2">
      <template x-for="l in links" :key="l.token">
        <div class="rounded border border-gray-100 p-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-medium text-gray-700">
                <span x-text="l.type == 'dir' ? '📁' : '📄'"></span>
                <span x-text="l.name"></span>
                <span x-show="l.has_password" class="ml-1 rounded bg-gray-100 px-1.5 py-0.5 text-xs text-gray-500">🔒 {{locales.link_protected}}</span>
              </div>
              <div class="truncate font-mono text-xs text-gray-400" x-text="l.path"></div>
            </div>
            <button type="button" @click="deleteLink(l)"
              class="rounded border border-red-300 px-2 py-0.5 text-xs text-red-600 hover:bg-red-50">{{locales.link_delete}}</button>
          </div>
          <div class="mt-2 flex items-stretch gap-2">
            <input readonly :value="linkUrl(l)"
              class="min-w-0 flex-1 rounded border border-gray-300 bg-gray-50 px-2 py-1.5 font-mono text-xs transition-colors duration-150"
              :class="linkCopyFlash == l.token ? 'border-green-400 bg-green-100 text-green-800' : ''"
              @click="$event.target.select()" />
            <button type="button" @click="copyLink(l)"
              class="min-w-[4.5rem] rounded px-3 py-1.5 text-sm font-medium transition-colors duration-150"
              :class="linkCopyFlash == l.token ? 'bg-green-500 text-white' : 'bg-pcatblue text-white'">
              <span x-text="linkCopyFlash == l.token ? '{{locales.link_copied}}' : '{{locales.link_copy}}'"></span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Samba missing / stopped -->
  <template x-if="sharesLoaded && !samba.installed">
    <div class="rounded-lg bg-white p-6 text-center shadow">
      <p class="text-gray-500">{{locales.shares_samba_missing}}</p>
      <button @click="installSamba()" :disabled="installing"
        class="mt-3 rounded bg-pcatblue px-4 py-2 text-sm text-white disabled:opacity-50">{{locales.shares_install_samba}}</button>
      <div x-show="installLog.length" class="mt-3 max-h-40 overflow-y-auto rounded bg-black p-2 text-left font-mono text-xs text-green-400">
        <template x-for="(line, i) in installLog" :key="i"><div x-text="line"></div></template>
      </div>
    </div>
  </template>

  <template x-if="sharesLoaded && samba.installed && !samba.running">
    <div class="flex items-center justify-between rounded-lg bg-yellow-50 p-4 shadow">
      <span class="text-sm text-yellow-800">{{locales.shares_samba_stopped}}</span>
      <button @click="sambaService('enable')" class="rounded bg-pcatblue px-3 py-1 text-sm text-white">{{locales.shares_btn_service_start}}</button>
    </div>
  </template>

  <!-- Shares list -->
  <template x-if="samba.installed">
    <div class="rounded-lg bg-white p-4 shadow">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-gray-700">{{locales.tab_shares}}</h3>
        <button @click="openShareEdit(null)" class="rounded bg-pcatblue px-3 py-1 text-sm text-white">{{locales.shares_add}}</button>
      </div>
      <div x-show="!shares.length" class="mt-4 text-center text-sm text-gray-400">{{locales.shares_no_shares}}</div>
      <div class="mt-2 space-y-2">
        <template x-for="share in shares" :key="share.id">
          <div class="flex flex-wrap items-center justify-between gap-2 rounded border border-gray-100 p-3">
            <div>
              <div class="font-medium text-gray-700">
                <span x-text="share.name"></span>
                <span x-show="!share.valid" class="ml-2 rounded bg-red-100 px-2 py-0.5 text-xs text-red-600">{{locales.shares_invalid}}</span>
                <span x-show="share.read_only" class="ml-1 rounded bg-gray-100 px-2 py-0.5 text-xs text-gray-500">{{locales.shares_read_only}}</span>
              </div>
              <div class="font-mono text-xs text-gray-400" x-text="share.path"></div>
              <div class="text-xs text-gray-500">
                <span x-show="share.mode == 'guest'">{{locales.shares_mode_guest}}</span>
                <span x-show="share.mode == 'users'" x-text="share.users.join(', ')"></span>
              </div>
              <div x-show="share.http_browse" class="mt-1 text-xs">
                <span class="text-gray-400">{{locales.shares_public_url}}:</span>
                <a :href="publicUrl(share)" target="_blank" class="text-pcatblue hover:underline" x-text="publicUrl(share)"></a>
                <button @click="copyPublicUrl(share)" class="ml-1 text-gray-400 hover:text-gray-600">⧉</button>
              </div>
            </div>
            <div class="flex gap-2">
              <button @click="openShareEdit(share)" class="rounded border border-gray-300 px-3 py-1 text-xs text-gray-600 hover:bg-gray-50">{{locales.shares_edit}}</button>
              <button @click="deleteShare(share)" class="rounded border border-red-300 px-3 py-1 text-xs text-red-600 hover:bg-red-50">{{locales.shares_btn_delete}}</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Users card -->
  <template x-if="samba.installed">
    <div class="rounded-lg bg-white p-4 shadow">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-gray-700">{{locales.shares_users_title}}</h3>
        <button @click="userModal = { open: true, name: '', password: '' }" class="rounded border border-gray-300 px-3 py-1 text-sm text-gray-600 hover:bg-gray-50">{{locales.shares_add_user}}</button>
      </div>
      <div class="mt-2 flex flex-wrap gap-2">
        <template x-for="u in smbUsers" :key="u">
          <span class="flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1 text-sm text-gray-600">
            <span x-text="u"></span>
            <button @click="removeUser(u)" class="text-gray-400 hover:text-red-500">&times;</button>
          </span>
        </template>
      </div>
    </div>
  </template>

  <!-- Share editor modal -->
  <div x-show="shareEdit.open" x-cloak class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="shareEdit.open = false">
    <div class="w-full max-w-md rounded-lg bg-white p-5 shadow-xl">
      <h3 class="font-bold text-gray-700" x-text="shareEdit.id ? '{{locales.shares_edit}}' : '{{locales.shares_add}}'"></h3>
      <div class="mt-3 space-y-3 text-sm">
        <div>
          <label class="mb-1 block text-gray-500">{{locales.shares_name}}</label>
          <input x-model="shareEdit.name" class="w-full rounded border border-gray-300 px-2 py-1" />
        </div>
        <div>
          <label class="mb-1 block text-gray-500">{{locales.shares_path}}</label>
          <div class="flex gap-2">
            <input x-model="shareEdit.path" class="flex-1 rounded border border-gray-300 px-2 py-1 font-mono text-xs" />
            <button @click="chooseSharePath()" class="rounded border border-gray-300 px-3 py-1 text-gray-600 hover:bg-gray-50">{{locales.shares_choose}}</button>
          </div>
        </div>
        <div class="flex gap-4">
          <label class="flex items-center gap-1"><input type="radio" value="guest" x-model="shareEdit.mode" /> {{locales.shares_mode_guest}}</label>
          <label class="flex items-center gap-1"><input type="radio" value="users" x-model="shareEdit.mode" /> {{locales.shares_mode_users}}</label>
        </div>
        <div x-show="shareEdit.mode == 'users'" class="flex flex-wrap gap-2">
          <template x-for="u in smbUsers" :key="u">
            <label class="flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1">
              <input type="checkbox" :value="u" x-model="shareEdit.users" class="rounded" />
              <span x-text="u"></span>
            </label>
          </template>
        </div>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="shareEdit.read_only" class="rounded" /> {{locales.shares_read_only}}</label>
        <label class="flex items-center gap-2"><input type="checkbox" x-model="shareEdit.http_browse" class="rounded" /> {{locales.shares_http_browse}}</label>
        <p x-show="shareEdit.http_browse" class="rounded bg-yellow-50 p-2 text-xs text-yellow-800">{{locales.shares_http_browse_warn}}</p>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button @click="shareEdit.open = false" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-600">{{locales.shares_btn_cancel}}</button>
        <button @click="saveShare()" class="rounded bg-pcatblue px-4 py-2 text-sm text-white">{{locales.shares_btn_save}}</button>
      </div>
    </div>
  </div>

  <!-- User modal -->
  <div x-show="userModal.open" x-cloak class="fixed inset-0 z-40 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="userModal.open = false">
    <div class="w-full max-w-sm rounded-lg bg-white p-5 shadow-xl">
      <h3 class="font-bold text-gray-700">{{locales.shares_add_user}}</h3>
      <div class="mt-3 space-y-3 text-sm">
        <div>
          <label class="mb-1 block text-gray-500">{{locales.shares_username}}</label>
          <input x-model="userModal.name" class="w-full rounded border border-gray-300 px-2 py-1" autocomplete="off" />
        </div>
        <div>
          <label class="mb-1 block text-gray-500">{{locales.shares_password}}</label>
          <input type="password" x-model="userModal.password" class="w-full rounded border border-gray-300 px-2 py-1" autocomplete="new-password" />
        </div>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button @click="userModal.open = false" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-600">{{locales.shares_btn_cancel}}</button>
        <button @click="saveUser()" class="rounded bg-pcatblue px-4 py-2 text-sm text-white">{{locales.shares_btn_save}}</button>
      </div>
    </div>
  </div>
</div>
