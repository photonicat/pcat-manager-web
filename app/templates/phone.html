{% extends '_base.html' %}
{% block page_title %}{{locales["page_phone"]}}{% endblock %}

{% block content %}
<div class="container mx-auto w-full pt-10 pb-12 sm:pt-24 sm:pb-12 md:pt-28 lg:px-4" x-data="voiceCallsManager()" x-init="init()">

  <!-- ==================== Incoming call, floating ====================
       Fixed and above everything: a call arrives while you are somewhere
       else on the page, and the answer buttons are no use if you have to
       find them first. Ignoring it drops back to the page without touching
       the call, so this is dismissable but never missable. -->
  <template x-if="incomingCall.active && ignoredNumber !== (incomingCall.number || '?')">
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm"
      @keydown.escape.window="ignoreCall()">
      <div class="w-full max-w-sm rounded-3xl bg-white shadow-2xl p-7 text-center">
        <div class="relative inline-flex items-center justify-center w-24 h-24 mb-4">
          <span class="absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-40 animate-ping"></span>
          <span class="relative inline-flex items-center justify-center w-20 h-20 bg-blue-500 rounded-full">
            <svg class="h-9 w-9 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
            </svg>
          </span>
        </div>
        <p class="text-xs uppercase tracking-widest text-blue-600 font-semibold">{{ locales.voice_incoming_call }}</p>
        <p class="text-2xl font-semibold text-gray-900 mt-1" x-text="callerTitle(incomingCall.number)"></p>
        <!-- always the full number, even when a contact matched: knowing who
             it claims to be is not the same as knowing what number called.
             Hidden only when the headline already *is* the number. -->
        <p class="text-base font-mono text-gray-600 mt-1 h-6"
          x-show="incomingCall.number && callerTitle(incomingCall.number) !== incomingCall.number"
          x-text="incomingCall.number || ''"></p>

        <div class="mt-6 grid grid-cols-2 gap-3">
          <button @click="answerCall()" :disabled="answeringCall"
            class="col-span-2 flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white font-semibold shadow-lg transition-all active:scale-95">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
            </svg>
            {{ locales.voice_pickup }}
          </button>

          <button @click="silenceRinger()" :disabled="ringerSilenced"
            class="flex items-center justify-center gap-2 py-3 rounded-2xl bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-700 font-medium transition-all active:scale-95">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.73 21a2 2 0 01-3.46 0M18.63 13A17.9 17.9 0 0118 8M6.26 6.26A5.86 5.86 0 006 8c0 7-3 9-3 9h14M18 8a6 6 0 00-9.33-5M1 1l22 22"></path>
            </svg>
            {{ locales.voice_silence }}
          </button>

          <button @click="ignoreCall()"
            class="flex items-center justify-center gap-2 py-3 rounded-2xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium transition-all active:scale-95">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            {{ locales.voice_ignore }}
          </button>

          <button @click="hangupCall()" :disabled="hangingUpCall"
            class="col-span-2 flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-red-500 hover:bg-red-600 disabled:bg-gray-300 text-white font-semibold shadow-lg transition-all active:scale-95">
            <svg class="h-5 w-5 rotate-[135deg]" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
            </svg>
            {{ locales.voice_refuse }}
          </button>
        </div>
        <p class="mt-3 h-4 text-xs text-gray-400" x-cloak
          x-show="ringerSilenced" x-text="'{{ locales.voice_silence }} \u2713'"></p>
      </div>
    </div>
  </template>

  <!-- ==================== Settings drawer ====================
       Slides in from the right on desktop, full-height sheet on mobile. Kept
       out of the page flow so /phone is the dialer and the call lists; this
       is everything you configure once. -->
  <template x-if="settingsOpen">
    <div class="fixed inset-0 z-40 flex justify-end bg-gray-900/50 backdrop-blur-sm"
      @click.self="settingsOpen = false" @keydown.escape.window="settingsOpen = false">
      <div class="w-full sm:max-w-md h-full bg-white shadow-2xl flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 flex-shrink-0">
          <h2 class="font-bold uppercase text-gray-600 tracking-wide text-sm">{{ locales.voice_settings }}</h2>
          <button @click="settingsOpen = false"
            class="p-2 -mr-2 rounded-lg text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="flex-1 overflow-y-auto px-5 py-5">
          {% include '_phone_settings.html' %}
        </div>
      </div>
    </div>
  </template>

  <div class="flex items-center justify-between">
    <h1 class="px-1 py-4 font-bold uppercase text-gray-600">
      {{ locales.nav_phone }}
    </h1>
    <div class="flex items-center space-x-3">
      <!-- Audio status chip -->
      <div class="flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium"
        :class="audio.connected ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'">
        <span class="w-2 h-2 rounded-full"
          :class="audio.connected ? 'bg-green-500 animate-pulse' : 'bg-gray-400'"></span>
        <span x-text="audio.connected ? 'Audio live' : 'Audio idle'"></span>
      </div>
      <!-- everything you set once, out of the way of the dialer -->
      <button @click="settingsOpen = true" :title="'{{ locales.voice_settings }}'"
        class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
        <span class="hidden sm:inline">{{ locales.voice_settings }}</span>
      </button>
    </div>
  </div>

  <div class="mb-4 w-full px-2 leading-normal text-gray-800 md:px-0">
    {% include '_notification.html' %}

    <!-- Mic needs HTTPS banner -->
    <template x-if="!secure">
      <div class="mb-4 flex items-start p-4 bg-amber-50 border border-amber-300 rounded-xl text-sm text-amber-900">
        <svg class="h-5 w-5 mr-3 mt-0.5 flex-shrink-0 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        <div>
          <p class="font-semibold">You can hear calls, but the microphone needs HTTPS.</p>
          <p class="mt-1">Open <a :href="httpsUrl" class="underline font-mono font-semibold" x-text="httpsUrl"></a>
            and accept the certificate warning to talk from this page.</p>
        </div>
      </div>
    </template>

    <!-- ============ In-call panel (incoming / active / dialing) ============ -->
    <div x-show="incomingCall.active || callStatus.hasActiveCalls || dialing" x-cloak
      class="mb-8 bg-gradient-to-br from-slate-50 to-slate-100 rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-lg">

      <!-- ===== State: incoming call ===== -->
      <template x-if="incomingCall.active && ignoredNumber !== (incomingCall.number || '?')">
        <div class="text-center py-6">
          <p class="text-sm uppercase tracking-widest text-blue-600 font-semibold">{{ locales.voice_incoming }}</p>
          <p class="text-2xl font-semibold text-gray-900 mt-1" x-text="callerTitle(incomingCall.number)"></p>
          <p class="text-base font-mono text-gray-500" x-text="incomingCall.number || ''"></p>
        </div>
      </template>

      <!-- ===== State: active call =====
           Gated on isConnected(), not merely on hasActiveCalls: the modem
           reports a CLCC row from the moment it starts dialling, so the old
           condition claimed "In call" with a running timer about half a second
           after tapping Call -- while the far end went on ringing, silently,
           for another ten seconds. -->
      <template x-if="!incomingCall.active && callStatus.hasActiveCalls && isConnected()">
        <div class="text-center py-6">
          <p class="text-sm uppercase tracking-widest text-green-600 font-semibold mb-1">{{ locales.voice_in_call }}</p>
          <p class="text-3xl font-semibold text-gray-900" x-text="contactName(activeNumber()) || activeNumber()"></p>
          <p class="text-base font-mono text-gray-500 mt-1 h-5" x-text="contactName(activeNumber()) ? activeNumber() : ''"></p>
          <p class="text-xl font-mono text-gray-500 mt-2" x-text="callTimer"></p>
          <p x-show="isRecording()" x-cloak class="mt-1 text-xs font-semibold text-red-500 animate-pulse">
            ● REC <span x-text="recTime()"></span>
          </p>

          <!-- level meters -->
          <div class="max-w-xs mx-auto mt-5 space-y-2">
            <div class="flex items-center space-x-2 text-xs text-gray-500">
              <span class="w-8 text-right">Rx</span>
              <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-2 bg-green-500 rounded-full transition-all duration-100" :style="'width:' + audio.rxLevel + '%'"></div>
              </div>
            </div>
            <div class="flex items-center space-x-2 text-xs text-gray-500">
              <span class="w-8 text-right">Mic</span>
              <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all duration-100"
                  :class="audio.muted ? 'bg-gray-400' : 'bg-blue-500'"
                  :style="'width:' + audio.txLevel + '%'"></div>
              </div>
            </div>
          </div>

          <div class="flex justify-center items-center space-x-6 mt-6">
            <!-- record -->
            <button @click="toggleRecord()" :disabled="recToggling"
              :class="isRecording() ? 'bg-red-600 hover:bg-red-700' : 'bg-slate-600 hover:bg-slate-700'"
              class="flex items-center justify-center h-12 w-12 text-white rounded-full shadow transition-all hover:scale-105"
              :title="isRecording() ? locales.voice_stop_record : locales.voice_record">
              <span x-show="!isRecording()" class="block h-4 w-4 rounded-full border-2 border-white bg-red-500"></span>
              <span x-show="isRecording()" x-cloak class="block h-3.5 w-3.5 rounded-sm bg-white animate-pulse"></span>
            </button>
            <!-- mute -->
            <button @click="toggleMute()"
              :class="audio.muted ? 'bg-amber-500 hover:bg-amber-600' : 'bg-slate-600 hover:bg-slate-700'"
              class="flex items-center justify-center h-12 w-12 text-white rounded-full shadow transition-all hover:scale-105"
              :title="audio.muted ? 'Unmute' : 'Mute'">
              <svg x-show="!audio.muted" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path>
              </svg>
              <svg x-show="audio.muted" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M13.477 14.89A6 6 0 015.11 6.524l8.367 8.368zm1.414-1.414L6.524 5.11a6 6 0 018.367 8.367zM18 10a8 8 0 11-16 0 8 8 0 0116 0z" clip-rule="evenodd"></path>
              </svg>
            </button>
            <!-- hangup -->
            <button @click="hangupCall()" :disabled="hangingUpCall"
              class="flex items-center justify-center h-16 w-16 bg-red-500 hover:bg-red-600 disabled:bg-gray-300 text-white rounded-full shadow-lg transition-all hover:scale-105 active:scale-95">
              <svg class="h-7 w-7 rotate-[135deg]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
              </svg>
            </button>
            <!-- reconnect audio -->
            <button @click="startAudio()" x-show="!audio.connected"
              class="flex items-center justify-center h-12 w-12 bg-blue-500 hover:bg-blue-600 text-white rounded-full shadow transition-all hover:scale-105"
              title="Connect audio">
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM15.657 6.343a1 1 0 011.414 0A9.972 9.972 0 0119 12a9.972 9.972 0 01-1.929 5.657 1 1 0 01-1.414-1.414A7.972 7.972 0 0017 12a7.972 7.972 0 00-1.343-4.243 1 1 0 010-1.414z" clip-rule="evenodd"></path>
              </svg>
            </button>
          </div>
        </div>
      </template>

      <!-- ===== State: dialing / ringing =====
           Covers the whole pre-connect window, not just the fraction of a
           second the make POST is in flight: `dialing` clears as soon as that
           request returns, but the call is only alerting by then. Setup takes
           seconds that we do not control (~2s of it is EPS fallback off 5G-SA
           before the INVITE even goes out), so the least we can do is say so
           and offer a way out. -->
      <template x-if="!incomingCall.active && (dialing || (callStatus.hasActiveCalls && !isConnected()))">
        <div class="text-center py-10">
          <div class="relative inline-block mb-4">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-orange-200"></div>
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent absolute top-0"></div>
          </div>
          <p class="text-lg font-semibold text-gray-800"
            x-text="callState() === 'alerting' ? locales.voice_ringing : locales.voice_calling"></p>
          <p class="text-2xl font-mono text-orange-600" x-text="activeNumber() || dialNumber"></p>
          <div x-show="callStatus.hasActiveCalls" class="mt-6">
            <button @click="hangupCall()" :disabled="hangingUpCall"
              class="inline-flex items-center justify-center h-14 w-14 bg-red-500 hover:bg-red-600 disabled:bg-gray-300 text-white rounded-full shadow-lg transition-all hover:scale-105 active:scale-95"
              :title="locales.voice_cancel_call">
              <svg class="h-6 w-6 rotate-[135deg]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
              </svg>
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- ============ Idle: iPhone-style dialer + recents + contacts ============ -->
    <template x-if="!incomingCall.active && !callStatus.hasActiveCalls && !dialing">
      <div>
        <!-- mobile tab bar -->
        <div class="mb-4 flex sm:hidden bg-gray-100 rounded-xl p-1">
          <button @click="tab = 'recents'"
            :class="tab === 'recents' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'"
            class="flex-1 flex flex-col items-center py-2 text-xs font-medium rounded-lg transition-all">
            <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>{{ locales.voice_recents }}</span>
          </button>
          <button @click="tab = 'contacts'"
            :class="tab === 'contacts' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'"
            class="flex-1 flex flex-col items-center py-2 text-xs font-medium rounded-lg transition-all">
            <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span>{{ locales.voice_contacts }}</span>
          </button>
          <button @click="tab = 'recordings'; loadRecordings()"
            :class="tab === 'recordings' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'"
            class="flex-1 flex flex-col items-center py-2 text-xs font-medium rounded-lg transition-all">
            <svg class="h-5 w-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v3m-4 0h8M12 15a4 4 0 004-4V7a4 4 0 10-8 0v4a4 4 0 004 4zM19 11a7 7 0 01-14 0"></path>
            </svg>
            <span>{{ locales.voice_recordings }}</span>
          </button>
          <button @click="tab = 'keypad'"
            :class="tab === 'keypad' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'"
            class="flex-1 flex flex-col items-center py-2 text-xs font-medium rounded-lg transition-all">
            <svg class="h-5 w-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="6" cy="5" r="1.7"></circle><circle cx="12" cy="5" r="1.7"></circle><circle cx="18" cy="5" r="1.7"></circle>
              <circle cx="6" cy="11" r="1.7"></circle><circle cx="12" cy="11" r="1.7"></circle><circle cx="18" cy="11" r="1.7"></circle>
              <circle cx="6" cy="17" r="1.7"></circle><circle cx="12" cy="17" r="1.7"></circle><circle cx="18" cy="17" r="1.7"></circle>
            </svg>
            <span>{{ locales.voice_keypad }}</span>
          </button>
        </div>

        <div class="sm:grid sm:grid-cols-5 sm:gap-6 sm:items-start">
          <!-- ===== Dialer (keypad hidden on desktop) ===== -->
          <div class="sm:col-span-2 sm:block" :class="tab === 'keypad' ? '' : 'hidden'">
            <div class="bg-white rounded-2xl border border-gray-200 shadow-lg p-6">
              <!-- number display -->
              <div class="relative mb-1">
                <input x-model="dialNumber" type="tel" placeholder="{{ locales.voice_enter_number }}"
                  @keyup.enter="makeCall()"
                  class="w-full bg-transparent text-3xl font-semibold tracking-wide text-center text-gray-900 placeholder-gray-300 py-3 px-10 focus:outline-none sm:bg-slate-50 sm:border sm:border-slate-200 sm:rounded-2xl sm:shadow-inner sm:text-2xl sm:font-mono">
                <button x-show="dialNumber" @click="dialNumber = dialNumber.slice(0, -1)"
                  @mousedown.prevent
                  class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-gray-600">
                  <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path>
                  </svg>
                </button>
              </div>
              <p class="h-5 text-center text-sm font-medium text-gray-500 mb-3" x-text="contactName(dialNumber) || ''"></p>

              <!-- iPhone-style keypad: mobile only -->
              <div class="grid grid-cols-3 gap-y-3 gap-x-6 mb-5 max-w-[264px] mx-auto sm:hidden">
                <template x-for="k in keypadKeys" :key="k[0]">
                  <button @click="dialNumber += k[0]"
                    class="mx-auto flex h-16 w-16 flex-col items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 active:bg-gray-300 transition-colors select-none">
                    <span class="text-2xl font-semibold text-gray-900 leading-none" x-text="k[0]"></span>
                    <span class="text-[10px] font-medium tracking-widest text-gray-500 leading-none mt-1" x-text="k[1]"></span>
                  </button>

                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                          </svg>
                        </a>
                        <button @click="deleteRecording(r.name)" :disabled="deletingRecording[r.name]"
                          class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors" title="{{ locales.voice_delete }}">
                          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                          </svg>
                        </button>
                      </div>
                    </div>
                  </template>
                </div>

                <!-- empty -->
                <div x-show="!recordings.loading && filteredRecordings().length === 0" class="text-center py-12">
                  <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v3m-4 0h8M12 15a4 4 0 004-4V7a4 4 0 10-8 0v4a4 4 0 004 4zM19 11a7 7 0 01-14 0"></path>
                  </svg>
                  <p class="text-sm text-gray-500">{{ locales.voice_no_recordings }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

{% block bottom %}
<script defer>
  const locales = {{ locales | tojson }};
  // Wire rate of the modem PCM link; see pc_call_audio.py (16k wideband).
  const MODEM_RATE = 16000;

  document.addEventListener("alpine:init", () => {
    Alpine.store("app").set_page("phone");

    Alpine.data('voiceCallsManager', () => ({
      locales: locales,

      tab: 'keypad',
      listTab: 'recents',
      keypadKeys: [
        ['1', ''], ['2', 'ABC'], ['3', 'DEF'],
        ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'],
        ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'],
        ['*', ''], ['0', '+'], ['#', '']
      ],

      dialNumber: '',
      dialing: false,
      ringback: { ctx: null, timer: null },
      audioPath: '1',

      answeringCall: false,
      hangingUpCall: false,
      refreshingHistory: false,
      clearingHistory: false,
      deletingRecord: {},

      callStatus: { loading: false, hasActiveCalls: false, hasIncomingCall: false, calls: [] },
      incomingCall: { active: false, number: null, ring_count: 0, duration: 0 },
      // The number the user chose to ignore. Keyed on the number rather than a
      // boolean so the next caller still gets the overlay, and so a redial by
      // the same person is not silently swallowed once the call has ended.
      settingsOpen: false,
      ignoredNumber: null,
      ringerSilenced: false,
      callHistory: { loading: false, data: [] },
      historyFilter: 'all',
      notification: { show: false, message: '', type: 'info' },

      // ---- address book ----
      contacts: { loading: false, data: [] },
      addingContact: false,
      savingContact: false,
      deletingContact: {},
      newContact: { name: '', number: '' },
      editingContactId: null,

      // ---- call recording ----
      recordings: { loading: false, data: [] },
      deletingRecording: {},
      playingRec: null,
      autoRecord: false,
      savingAutoRecord: false,
      recToggling: false,
      recFilter: 'all',

      // ---- voicemail ----
      vm: { enabled: false, answer_secs: '15', greeting: false },
      savingVm: false,
      greetingRecording: false,
      greetingRecorder: null,
      greetingChunks: [],

      // ---- ring buzzer ----
      ringer: { enabled: true, melody: 'classic' },
      savingRinger: false,

      // ---- text to speech ----
      tts: { engine: false, voice: 'en', voices: [], downloading: false, download: {},
             selected_engine: 'espeak',
             kokoro: { engine: false, ready: false, model: 'full', voice: '3',
                       voices: [], models: [], engine_size_mb: 21 } },
      ttsText: '',
      savingTts: false,

      // ---- transcription ----
      trans: { engine: false, ready: false, model: '', lang: 'auto', langs: ['auto'],
               auto_vm: true, models: [], busy: false, queued: 0,
               downloading: false, download: {} },
      transPolling: false,
      // one-shot guards for syncSelects(), see the note there
      transSynced: false,
      ttsSynced: false,
      kokoroSynced: false,

      // ---- in-call audio ----
      secure: window.isSecureContext,
      httpsUrl: 'https://' + location.hostname + ':9443' + location.pathname,
      callTimer: '00:00',
      callStartedAt: null,
      timerInterval: null,
      audio: {
        connected: false,
        muted: false,
        rxLevel: 0,
        txLevel: 0,
        ctx: null,
        playT: 0,
        abort: null,
        stream: null,
        procNode: null,
        srcNode: null,
        txQueue: [],
        txTimer: null,
        txBusy: false,
        daemon: null,      // {token, port, available} or null => Python bridge
      },

      filteredCallHistory() {
        if (this.historyFilter === 'all') return this.callHistory.data;
        return this.callHistory.data.filter(call => call.type === this.historyFilter);
      },

      activeNumber() {
        const c = this.callStatus.calls[0];
        return c ? c.number : '';
      },

      normNum(n) {
        return (n || '').replace(/[^0-9+]/g, '');
      },

      // iPhone-style suffix matching: numbers stored with/without a country
      // prefix still resolve to the same contact.
      contactName(number) {
        const n = this.normNum(number);
        if (!n) return null;
        for (const c of this.contacts.data) {
          const cn = this.normNum(c.number);
          if (!cn) continue;
          if (cn === n) return c.name;
          const shorter = n.length < cn.length ? n : cn;
          const longer = n.length < cn.length ? cn : n;
          if (shorter.length >= 7 && longer.endsWith(shorter.replace(/^\+/, ''))) return c.name;
        }
        return null;
      },

      init() {
        this.refreshCallStatus();
        this.refreshCallHistory();
        this.refreshIncomingCall();
        this.loadContacts();
        this.loadRecordConfig();
        this.loadRecordings();
        this.loadVmConfig();
        this.loadRingerConfig();
        this.loadTransStatus();
        this.loadTtsStatus();

        // Poll faster while a call is happening. At a flat 2s an outgoing call
        // could be answered and sit connected for most of two seconds before
        // the timer started and audio was hooked up -- the caller hears the
        // first words of the reply and we are still not streaming. Idle
        // devices stay at 2s so the modem is left alone.
        const pollStatus = async () => {
          if (!document.hidden) await this.refreshCallStatus();
          const busy = this.callStatus.hasActiveCalls || this.dialing ||
                       this.incomingCall.active;
          setTimeout(pollStatus, busy ? 500 : 2000);
        };
        pollStatus();
        setInterval(() => { if (!document.hidden) this.refreshIncomingCall(); }, 1000);
        window.addEventListener('beforeunload', () => this.stopAudio(false));
      },

      // ============================ audio =============================
      // Where the two audio endpoints live. The pcat-call-audio daemon serves
      // them on its own port with ALSA driven directly from C -- no arecord,
      // no pipes, no interpreter in the sample path. If it is not running
      // (older package, no cert, no card) we fall back to the in-process
      // Python bridge on this origin, which still works, just with more
      // buffering. Resolved once per call in startAudio().
      audioBase(path) {
        const d = this.audio.daemon;
        if (!d || !d.available) return path;
        // Same host, different port => different origin. The daemon sends
        // CORS headers for exactly this.
        return 'https://' + location.hostname + ':' + d.port + path;
      },

      audioUrl(path) {
        const d = this.audio.daemon;
        const base = this.audioBase(path);
        if (!d || !d.available) return base;
        // Token on the query string for the streaming GET: it is the form
        // that survives a plain fetch() with no custom headers, which keeps
        // the request simple (no CORS preflight on the stream).
        return base + '?token=' + encodeURIComponent(d.token);
      },

      async resolveAudioDaemon() {
        try {
          const r = await fetch('/api/v1/voice_call/audio/token.json');
          const d = await r.json();
          this.audio.daemon = d && d.success ? d : null;
        } catch (e) {
          this.audio.daemon = null;   // fall back to the Python bridge
        }
      },

      async startAudio() {
        if (this.audio.connected) return;
        try {
          await this.resolveAudioDaemon();
          // Ask for a 16k context so the browser's own (properly filtered)
          // resampler handles the microphone, instead of the naive
          // decimation below. Falls back silently if unsupported.
          if (!this.audio.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            try { this.audio.ctx = new AC({ sampleRate: MODEM_RATE }); }
            catch (e) { this.audio.ctx = new AC(); }
          }
          await this.audio.ctx.resume();
          // Start close to now; playChunk keeps it there. A big initial
          // offset is delay paid for the whole call, not just the first chunk.
          this.audio.playT = this.audio.ctx.currentTime + 0.04;
          this.startRx();
          if (this.secure) {
            await this.startTx();
          }
          this.audio.connected = true;
        } catch (e) {
          this.showNotification('Audio start failed: ' + e.message, 'error');
          this.stopAudio(false);
        }
      },

      startRx() {
        // Pull the raw 8kHz S16 stream and schedule it into WebAudio.
        this.audio.abort = new AbortController();
        fetch(this.audioUrl('/api/v1/voice_call/audio/stream'),
              { signal: this.audio.abort.signal })
          .then(async (resp) => {
            if (!resp.ok) throw new Error('stream ' + resp.status);
            const reader = resp.body.getReader();
            let carry = new Uint8Array(0);
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              let buf = new Uint8Array(carry.length + value.length);
              buf.set(carry); buf.set(value, carry.length);
              const usable = buf.length - (buf.length % 2);
              carry = buf.slice(usable);
              if (usable === 0) continue;
              this.playChunk(new Int16Array(buf.buffer, 0, usable / 2));
            }
          })
          .catch((e) => { if (e.name !== 'AbortError') console.error('rx stream:', e); });
      },

      playChunk(samples) {
        const ctx = this.audio.ctx;
        if (!ctx || samples.length === 0) return;
        const buf = ctx.createBuffer(1, samples.length, MODEM_RATE);
        const ch = buf.getChannelData(0);
        let peak = 0;
        for (let i = 0; i < samples.length; i++) {
          ch[i] = samples[i] / 32768;
          const a = Math.abs(ch[i]);
          if (a > peak) peak = a;
        }
        this.audio.rxLevel = Math.min(100, Math.round(peak * 140));
        const now = ctx.currentTime;
        // Keep playback pinned just ahead of real time. playT is the running
        // schedule; every chunk pushes it forward by its own duration, so any
        // moment where chunks arrive faster than they play (a burst after a
        // stall, a rate mismatch, a tab unhiding) walks it further into the
        // future and stays there -- that delay is never repaid.
        //
        // The old rule dropped one chunk once playT passed now+1s, which
        // trimmed the schedule to a second and pegged it there. Instead,
        // resync hard: if we are further ahead than the jitter cushion needs,
        // collapse the schedule back to the floor. Late audio is worthless on
        // a live call, so throwing it away is strictly better than playing it.
        const FLOOR = 0.04;   // ~2 chunks of cushion against jitter
        const CEIL = 0.18;    // resync once the schedule exceeds this
        if (this.audio.playT > now + CEIL) this.audio.playT = now + FLOOR;
        if (this.audio.playT < now + FLOOR) this.audio.playT = now + FLOOR;
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(this.audio.playT);
        this.audio.playT += buf.duration;
      },

      async startTx() {
        this.audio.stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        const ctx = this.audio.ctx;
        const src = ctx.createMediaStreamSource(this.audio.stream);

        // Preferred path: an AudioWorklet, whose render quantum is 128 frames
        // = 8ms at our 16k context. The ScriptProcessor below costs its whole
        // buffer in delay, and measured in Chrome that was 64ms -- the old
        // "~21ms" assumed a 48k context, but we explicitly ask for 16k and get
        // it. Worth 56ms, and it moves the mic off the main thread.
        if (ctx.audioWorklet) {
          try {
            await ctx.audioWorklet.addModule(
              '/static/mic-worklet.js?v={{ cache_bust_version }}');
            const node = new AudioWorkletNode(ctx, 'mic-processor', {
              numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
              processorOptions: { targetRate: MODEM_RATE }
            });
            node.port.onmessage = (ev) => {
              const d = ev.data;
              if (!d || !d.pcm) return;
              this.audio.txLevel = this.audio.muted ? 0
                : Math.min(100, Math.round(d.peak * 140));
              const frame = new Int16Array(d.pcm);
              // Also zeroed here, not only in the worklet: the mute message
              // takes a hop to reach the audio thread, and this closes that gap.
              if (this.audio.muted) frame.fill(0);
              this.audio.txQueue.push(frame);
            };
            // Muting in the worklet as well as here: the page can still be
            // mid-batch when the user hits mute.
            this.audio.micNode = node;
            src.connect(node);
            // Through a silent gain, not straight to the destination: the graph
            // has to pull the node for process() to run, but routing the mic to
            // the speakers would be local echo.
            const sink = ctx.createGain();
            sink.gain.value = 0;
            node.connect(sink);
            sink.connect(ctx.destination);
            this.audio.micSink = sink;
            this.audio.srcNode = src;
            this.audio.procNode = node;      // stopAudio() disconnects this
            this.audio.txTimer = setInterval(() => this.flushTx(), 40);
            return;
          } catch (e) {
            console.warn('mic worklet unavailable, falling back:', e);
          }
        }

        // Fallback for browsers without AudioWorklet. Size the buffer by the
        // context's real rate for ~16ms rather than hard-coding 1024 frames,
        // which is 64ms at 16k.
        const want = Math.pow(2, Math.round(Math.log2(ctx.sampleRate * 0.016)));
        const bufSize = Math.min(16384, Math.max(256, want));
        const proc = ctx.createScriptProcessor(bufSize, 1, 1);
        const ratio = ctx.sampleRate / MODEM_RATE;
        // Box-average across each output period rather than picking one sample
        // of every `ratio`. Nearest-neighbour decimation has no anti-aliasing,
        // and folding 48k speech down to 16k that way is audibly garbled.
        // Costs one add per input sample. When the context is already at
        // MODEM_RATE this reduces to a straight copy.
        let acc = 0, accN = 0, readPos = 0;
        proc.onaudioprocess = (ev) => {
          const inp = ev.inputBuffer.getChannelData(0);
          const out = [];
          let peak = 0;
          for (let i = 0; i < inp.length; i++) {
            const v = inp[i];
            acc += v; accN++;
            const a = Math.abs(v);
            if (a > peak) peak = a;
            readPos += 1;
            if (readPos >= ratio) {
              const m = acc / accN;
              out.push(Math.max(-32768, Math.min(32767, Math.round(m * 32767))));
              acc = 0; accN = 0; readPos -= ratio;
            }
          }
          this.audio.txLevel = this.audio.muted ? 0 : Math.min(100, Math.round(peak * 140));
          const frame = new Int16Array(out);
          if (this.audio.muted) frame.fill(0);
          this.audio.txQueue.push(frame);
        };
        src.connect(proc);
        proc.connect(ctx.destination);   // required for onaudioprocess to fire
        this.audio.srcNode = src;
        this.audio.procNode = proc;
        // 40ms: mic audio waits here before it is even sent, so the interval
        // is added uplink delay one-for-one. The sink's ALSA buffer is 120ms
        // and aplay stops the stream the moment it drains, so posting well
        // inside that keeps it fed. 25 small POSTs a second is nothing next
        // to the downlink stream itself.
        this.audio.txTimer = setInterval(() => this.flushTx(), 40);
      },

      async flushTx() {
        const q = this.audio.txQueue;
        if (q.length === 0) return;
        // One POST in flight at a time. These are ordered audio: if a slow
        // request overlapped the next tick, two POSTs would race and the
        // module could be fed mic audio out of order. Skipping a tick is
        // harmless -- the queue simply carries into the next flush.
        if (this.audio.txBusy) return;
        this.audio.txBusy = true;
        this.audio.txQueue = [];
        let total = 0;
        for (const f of q) total += f.length;
        const merged = new Int16Array(total);
        let off = 0;
        for (const f of q) { merged.set(f, off); off += f.length; }
        try {
          // Token on the query string rather than a header: a custom header
          // would make this a non-simple cross-origin request and cost a
          // CORS preflight OPTIONS on every single POST -- 25 extra
          // round-trips a second, straight onto uplink latency.
          // Content-Type stays text/plain for the same reason.
          await fetch(this.audioUrl('/api/v1/voice_call/audio/tx'), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: merged.buffer
          });
        } catch (e) { /* transient network errors are fine mid-call */ }
        finally { this.audio.txBusy = false; }
      },

      stopAudio(tellServer = true) {
        this.stopRingback();
        if (this.audio.abort) { this.audio.abort.abort(); this.audio.abort = null; }
        if (this.audio.txTimer) { clearInterval(this.audio.txTimer); this.audio.txTimer = null; }
        if (this.audio.procNode) { this.audio.procNode.disconnect(); this.audio.procNode = null; }
        if (this.audio.micSink) { this.audio.micSink.disconnect(); this.audio.micSink = null; }
        this.audio.micNode = null;
        if (this.audio.srcNode) { this.audio.srcNode.disconnect(); this.audio.srcNode = null; }
        if (this.audio.stream) {
          this.audio.stream.getTracks().forEach(t => t.stop());
          this.audio.stream = null;
        }
        this.audio.txQueue = [];
        this.audio.txBusy = false;
        this.audio.micNode = null;
        if (this.audio.ctx) {
          // closing the context discards every already-scheduled buffer --
          // without this, backlogged audio keeps playing long after hangup
          this.audio.ctx.close().catch(() => {});
          this.audio.ctx = null;
        }
        this.audio.playT = 0;
        this.audio.connected = false;
        this.audio.rxLevel = 0;
        this.audio.txLevel = 0;
        if (tellServer) {
          // Always tell Flask: it owns the recording taps and the in-process
          // bridge, both of which need an explicit stop. The C daemon has no
          // stop endpoint by design -- aborting the stream fetch above closes
          // its socket, which ends the capture, and its reaper closes the
          // playback device once the POSTs stop.
          fetch('/api/v1/voice_call/audio/stop', { method: 'POST' }).catch(() => {});
        }
        this.audio.daemon = null;
      },

      // The worklet zeroes samples itself, so a batch already in flight on the
      // audio thread is muted too, not just what the page has yet to queue.
      pushMuteToWorklet() {
        const n = this.audio.micNode;
        if (n && n.port) { try { n.port.postMessage({ muted: !!this.audio.muted }); } catch (e) {} }
      },

      toggleMute() { this.audio.muted = !this.audio.muted; this.pushMuteToWorklet(); },

      // ---- call timer ----
      // serverSeconds: how long the server says the call has been connected.
      // The clock is anchored to that instead of to the moment this poll ran,
      // so the timer is right from the first tick and a page reload mid-call
      // picks up where it should rather than restarting at 00:00.
      startTimer(serverSeconds) {
        this.callStartedAt = Date.now() - (serverSeconds || 0) * 1000;
        if (this.timerInterval) clearInterval(this.timerInterval);
        const tick = () => {
          const s = Math.max(0, Math.floor((Date.now() - this.callStartedAt) / 1000));
          this.callTimer = this.fmtSeconds(s);
        };
        tick();
        this.timerInterval = setInterval(tick, 500);
      },

      stopTimer() {
        if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
        this.callTimer = '00:00';
        this.callStartedAt = null;
      },

      // ========================= call control =========================
      callNumber(number) {
        this.dialNumber = number;
        this.makeCall();
      },

      async makeCall() {
        if (!this.dialNumber || this.dialing) return;
        this.dialing = true;
        try {
          const response = await fetch('/api/v1/voice_call/make', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ number: this.dialNumber })
          });
          const data = await response.json();
          if (data.success) {
            this.refreshCallStatus();
            this.refreshCallHistory();
          } else {
            this.showNotification('Failed to make call: ' + (data.error || 'Unknown error'), 'error');
          }
        } catch (error) {
          this.showNotification('Error making call: ' + error.message, 'error');
        } finally {
          this.dialing = false;
        }
      },

      // State of the call the modem is reporting: dialing -> alerting ->
      // active for an outgoing call. AT+CLCC gives us this all along; the page
      // simply was not looking at it, which is why it could not tell ringing
      // from connected.
      callState() {
        const c = (this.callStatus.calls || [])[0];
        return c ? (c.status || '') : '';
      },

      isConnected() {
        return this.callState() === 'active';
      },

      isOutgoingRinging() {
        const c = (this.callStatus.calls || [])[0];
        return !!c && c.direction === 'outgoing' && c.status !== 'active';
      },

      // Local ringback, because the network gives us none: measured on a live
      // call, the downlink carries digital silence (RMS < 300) from the moment
      // it opens until the far end picks up, so without this the caller stares
      // at a spinner in total silence for ten seconds and assumes it is broken.
      // 450Hz, 1s on / 4s off is the Chinese ringback cadence, and these are
      // Chinese-carrier SIMs.
      //
      // Deliberately on its own AudioContext: the call path's ctx is opened and
      // closed by startAudio()/stopAudio() around the same events, and nothing
      // about a courtesy tone is worth risking the actual call audio for.
      startRingback() {
        if (this.ringback.timer) return;
        try {
          if (!this.ringback.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ringback.ctx = new AC();
          }
          this.ringback.ctx.resume().catch(() => {});
          const burst = () => this.ringbackBurst();
          burst();
          this.ringback.timer = setInterval(burst, 5000);
        } catch (e) { /* no audio output is not a reason to fail the call */ }
      },

      ringbackBurst() {
        const ctx = this.ringback.ctx;
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 450;
        const t = ctx.currentTime;
        // Ramped, not gated: a hard start/stop on a 450Hz sine clicks.
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
        gain.gain.setValueAtTime(0.12, t + 0.95);
        gain.gain.linearRampToValueAtTime(0, t + 1.0);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 1.02);
      },

      stopRingback() {
        if (this.ringback.timer) {
          clearInterval(this.ringback.timer);
          this.ringback.timer = null;
        }
        if (this.ringback.ctx) {
          this.ringback.ctx.close().catch(() => {});
          this.ringback.ctx = null;
        }
      },

      // Who is calling, for the headline. The number itself is always shown
      // underneath, so this never has to fall back to it.
      callerTitle(number) {
        return this.contactName(number) || number || '{{ locales.voice_unknown }}';
      },

      // Quiet, but still ringing: the caller hears ringback as before and
      // voicemail still answers on schedule. Only the buzzer stops.
      async silenceRinger() {
        this.ringerSilenced = true;
        try {
          await fetch('/api/v1/voice_call/ringer/silence', { method: 'POST' });
        } catch (error) {
          this.ringerSilenced = false;
          this.showNotification('Could not silence the ringer: ' + error.message, 'error');
        }
      },

      // Dismiss the overlay without touching the call -- it keeps ringing and
      // voicemail can still take it. Silences the buzzer too, since leaving it
      // sounding with the dialog gone would be the worst of both.
      ignoreCall() {
        this.ignoredNumber = this.incomingCall.number || '?';
        if (!this.ringerSilenced) this.silenceRinger();
      },

      async answerCall() {
        this.answeringCall = true;
        try {
          const response = await fetch('/api/v1/voice_call/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const data = await response.json();
          if (data.success) {
            this.incomingCall.active = false;
            this.callStatus.hasIncomingCall = false;
            this.refreshCallStatus();
          } else {
            this.showNotification('Failed to answer call: ' + (data.error || 'Unknown error'), 'error');
          }
        } catch (error) {
          this.showNotification('Error answering call: ' + error.message, 'error');
        } finally {
          this.answeringCall = false;
        }
      },

      async hangupCall() {
        this.hangingUpCall = true;
        try {
          const response = await fetch('/api/v1/voice_call/hangup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const data = await response.json();
          if (data.success) {
            this.incomingCall.active = false;
            this.callStatus.hasIncomingCall = false;
            this.refreshCallStatus();
            this.refreshCallHistory();
          } else {
            this.showNotification('Failed to hangup call: ' + (data.error || 'Unknown error'), 'error');
          }
        } catch (error) {
          this.showNotification('Error hanging up call: ' + error.message, 'error');
        } finally {
          this.hangingUpCall = false;
        }
      },

      async refreshCallStatus() {
        try {
          const response = await fetch('/api/v1/voice_call/status');
          const data = await response.json();
          if (data.success) {
            const wasActive = this.callStatus.hasActiveCalls;
            this.callStatus.calls = data.calls || [];
            this.callStatus.hasActiveCalls = data.has_active_calls || false;
            this.callStatus.recording = data.recording || null;
            // Ringback follows the reported state, so it stops the instant the
            // call connects and the real downlink takes over.
            if (this.isOutgoingRinging()) this.startRingback();
            else this.stopRingback();
            // audio + timer follow the call state. Audio still starts here
            // rather than at connect: the modem clocks the card while dialling
            // (verified -- the stream opens 200 OK and delivers bytes), so the
            // token, TLS handshake, ALSA open and getUserMedia are all paid
            // during setup instead of in the first second of conversation.
            if (this.callStatus.hasActiveCalls && !wasActive) {
              this.startTimer(data.call_seconds);
              this.startAudio();
            } else if (this.callStatus.hasActiveCalls && this.timerInterval) {
              // Re-anchor on every poll: cheap, and it keeps the display from
              // drifting away from the server's idea of the call length.
              this.callStartedAt = Date.now() - (data.call_seconds || 0) * 1000;
            } else if (!this.callStatus.hasActiveCalls && wasActive) {
              this.stopTimer();
              this.stopRingback();
              this.stopAudio();
              this.refreshCallHistory();
              // let the background opus encode land, then show the new file
              setTimeout(() => this.loadRecordings(), 2500);
            }
          }
        } catch (error) {
          console.error('Error refreshing call status:', error);
        }
      },

      async setAudioPath() {
        try {
          const response = await fetch('/api/v1/voice_call/audio_path', {
            method: 'POST',

          });
          const data = await response.json();

          }

      async refreshIncomingCall() {
        try {
          const response = await fetch('/api/v1/voice_call/incoming');
          const data = await response.json();
          if (data.success) {
            const wasActive = this.incomingCall.active;
            this.incomingCall = data.incoming_call;
            if (this.incomingCall.active && !wasActive) {
              this.showNotification('Incoming call from ' + (this.contactName(this.incomingCall.number) || this.incomingCall.number || 'Unknown'), 'info');
              this.callStatus.hasIncomingCall = true;
            } else if (!this.incomingCall.active && wasActive) {
              this.refreshCallHistory();
              this.callStatus.hasIncomingCall = false;
              // Clear per-call dismissal, or the next caller would arrive
              // already ignored and already silenced.
              this.ignoredNumber = null;
              this.ringerSilenced = false;
            }
          }
        } catch (error) {
          console.error('Error checking incoming calls:', error);

        this.savingContact = true;
        const editing = this.editingContactId;

      // ========================= call recording =========================
      isRecording() {
        return !!(this.callStatus.recording && this.callStatus.recording.recording);
      },

      recTime() {
        const s = Math.floor((this.callStatus.recording && this.callStatus.recording.seconds) || 0);
        return this.fmtSeconds(s);
      },

      fmtSeconds(s) {
        s = Math.max(0, Math.floor(s || 0));
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        return mm + ':' + ss;
      },

      fmtSize(bytes) {
        if (!bytes) return '0 KB';
        if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      },

      // Alpine applies x-model to a <select> before the <template x-for>
      // inside it has produced any <option>, so a stored value that is not the
      // first option matches nothing and the browser snaps the element to
      // index 0 -- the page claims "tiny"/"int8" while the device is really on
      // "medium"/"full". Re-assign once the options exist; blanking first
      // forces the write even when the value is unchanged, which a plain
      // same-value assignment would skip. Only the initial render is affected,
      // so each loader does this once rather than on every poll (which would
      // otherwise stomp on a selection the user is in the middle of making).
      syncSelects(pairs) {
        pairs.forEach(([obj, key]) => { obj[key] = ''; });
        this.$nextTick(() => pairs.forEach(([obj, key, value]) => { obj[key] = value; }));
      },

      // ========================= text to speech =========================
      async loadTtsStatus() {
        try {
          const response = await fetch('/api/v1/voice_call/tts/status');
          const data = await response.json();
          if (data.success) {
            this.tts.engine = !!data.engine;
            this.tts.voice = data.voice || 'en';
            this.tts.voices = data.voices || [];
            this.tts.downloading = !!data.downloading;
            this.tts.download = data.download || {};
            this.tts.selected_engine = data.selected_engine || 'espeak';
            if (data.kokoro) this.tts.kokoro = data.kokoro;
            if (!this.ttsSynced) {
              this.ttsSynced = true;
              this.syncSelects([[this.tts, 'voice', data.voice || 'en'],
                                [this.tts.kokoro, 'voice', this.tts.kokoro.voice]]);
            }
            // the neural model picker only mounts once that engine is
            // installed, so it gets its own one-shot when the block appears
            if (!this.kokoroSynced && this.tts.kokoro.engine) {
              this.kokoroSynced = true;
              this.syncSelects([[this.tts.kokoro, 'model', this.tts.kokoro.model]]);
            }
          }
          if (this.tts.downloading) setTimeout(() => this.loadTtsStatus(), 2000);
        } catch (error) {
          console.error('Error loading TTS status:', error);
        }
      },

      ttsPct() {
        const d = this.tts.download || {};
        if (!d.total) return 0;
        return Math.min(100, Math.round((d.done || 0) * 100 / d.total));
      },

      // ========================= transcription =========================
      async loadTransStatus() {
        try {
          const response = await fetch('/api/v1/voice_call/transcribe/status');
          const data = await response.json();
          if (data.success) {
            this.trans.engine = !!data.engine;
            this.trans.ready = !!data.ready;
            this.trans.model = data.model;
            this.trans.lang = data.lang;
            this.trans.langs = data.langs || ['auto'];
            this.trans.auto_vm = !!data.auto_vm;
            this.trans.models = data.models || [];
            this.trans.busy = !!data.busy;
            this.trans.queued = data.queued || 0;
            this.trans.downloading = !!data.downloading;
            this.trans.download = data.download || {};
            if (!this.transSynced) {
              this.transSynced = true;
              this.syncSelects([[this.trans, 'model', data.model],
                                [this.trans, 'lang', data.lang]]);
            }
          }
          // keep polling while work is in flight, then refresh the list once
          if (this.trans.downloading || this.trans.busy || this.trans.queued > 0) {
            if (!this.transPolling) this.transPolling = true;
            setTimeout(() => this.loadTransStatus(), 2500);
          } else if (this.transPolling) {
            this.transPolling = false;
            this.loadRecordings();

        } catch (error) {
          this.transPolling = false;
          console.error('Error loading transcribe status:', error);

      async downloadModel() {
        try {
          const response = await fetch('/api/v1/voice_call/transcribe/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: this.trans.model })
          });
          const data = await response.json();
          if (!data.success) {
            this.showNotification('Download failed: ' + (data.error || 'Unknown error'), 'error');
          }
          this.loadTransStatus();
        } catch (error) {
          this.showNotification('Download error: ' + error.message, 'error');
        }
      },

      async transcribeRec(name) {
        try {
          const response = await fetch('/api/v1/voice_call/transcribe/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
          });
          const data = await response.json();
          if (data.success) {
            const r = this.recordings.data.find(r => r.name === name);
            if (r) r.transcribing = true;
            this.loadTransStatus();
          } else {
            this.showNotification('Transcription failed: ' + (data.error || 'Unknown error'), 'error');
          }
        } catch (error) {
          this.showNotification('Transcription error: ' + error.message, 'error');
        }
      },

      async toggleGreetingRecord() {
        if (this.greetingRecording) {
          if (this.greetingRecorder && this.greetingRecorder.state === 'recording') this.greetingRecorder.stop();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mr = new MediaRecorder(stream);
          this.greetingChunks = [];
          mr.ondataavailable = (e) => { if (e.data.size) this.greetingChunks.push(e.data); };
          mr.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            this.greetingRecording = false;
            const blob = new Blob(this.greetingChunks, { type: mr.mimeType || 'audio/webm' });
            try {
              const resp = await fetch('/api/v1/voice_call/voicemail/greeting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/octet-stream' },
                body: blob
              });
              const data = await resp.json();
              if (data.success) {
                this.vm.greeting = true;
                this.showNotification('Greeting saved', 'info');
              } else {
                this.showNotification('Greeting save failed: ' + (data.error || 'Unknown error'), 'error');
              }
            } catch (e) {
              this.showNotification('Greeting upload error: ' + e.message, 'error');
            }
          };
          mr.start();
          this.greetingRecorder = mr;
          this.greetingRecording = true;
          // hard cap so a forgotten recorder can't run forever
          setTimeout(() => {
            if (this.greetingRecording && mr.state === 'recording') mr.stop();
          }, 30000);
        } catch (e) {
          this.showNotification('Microphone error: ' + e.message, 'error');
        }
      },

      playGreeting() {
        const player = this.$refs.recPlayer;
        if (!player) return;
        this.playingRec = null;
        player.src = '/api/v1/voice_call/voicemail/greeting?t=' + Date.now();
        player.play().catch((e) => { this.showNotification('Playback failed: ' + e.message, 'error'); });
      },

      async deleteGreeting() {
        if (!confirm('Delete the greeting?')) return;
        try {
          const response = await fetch('/api/v1/voice_call/voicemail/greeting', { method: 'DELETE' });
          const data = await response.json();
          if (data.success) this.vm.greeting = false;
          else this.showNotification('Failed to delete greeting: ' + (data.error || 'Unknown error'), 'error');
        } catch (error) {
          this.showNotification('Error deleting greeting: ' + error.message, 'error');
        }
      },

      async deleteRecording(name) {
        if (!confirm('Delete this recording?')) return;
        this.deletingRecording[name] = true;
        try {
          if (this.playingRec === name && this.$refs.recPlayer) {
            this.$refs.recPlayer.pause();
            this.playingRec = null;
          }
          const response = await fetch('/api/v1/voice_call/recordings/' + encodeURIComponent(name), { method: 'DELETE' });
          const data = await response.json();
          if (data.success) this.loadRecordings();
          else this.showNotification('Failed to delete recording: ' + (data.error || 'Unknown error'), 'error');
        } catch (error) {
          this.showNotification('Error deleting recording: ' + error.message, 'error');
        } finally {
          this.deletingRecording[name] = false;
        }
      },

      showNotification(message, type = 'info') {
        this.notification.message = message;
        this.notification.type = type;
        this.notification.show = true;
        if (type !== 'error') {
          setTimeout(() => { this.notification.show = false; }, 4000);
        }
      }
    }));
  });
</script>
