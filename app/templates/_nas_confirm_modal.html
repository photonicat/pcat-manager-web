<div x-show="confirm.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="confirmCancel()">
  <div class="w-full max-w-sm rounded-lg bg-white p-5 shadow-xl">
    <h3 class="font-bold text-gray-700" x-text="confirm.title || '{{locales.confirm_title}}'"></h3>
    <p class="mt-2 text-sm text-gray-500" x-text="confirm.body"></p>
    <div x-show="confirm.expect" class="mt-3">
      <label class="mb-1 block text-xs text-gray-500">{{locales.confirm_type_name}}: <span class="font-mono font-bold" x-text="confirm.expect"></span></label>
      <input x-model="confirm.typed" class="w-full rounded border border-gray-300 px-2 py-1 font-mono text-sm" autocomplete="off" />
    </div>
    <div class="mt-4 flex justify-end gap-2">
      <button @click="confirmCancel()" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-600">{{locales.shares_btn_cancel}}</button>
      <!-- Coerce to a real boolean. `expect && ...` yields "" when there is
           nothing to type, and Alpine binds an empty string on a boolean
           attribute as PRESENT (HTML's disabled="" semantics) — which left
           Confirm permanently greyed out on every no-typing dialog. -->
      <button @click="confirmOk()" :disabled="!!(confirm.expect && confirm.typed != confirm.expect)"
        class="rounded bg-red-600 px-4 py-2 text-sm text-white disabled:opacity-40">{{locales.confirm_btn}}</button>
    </div>
  </div>
</div>
