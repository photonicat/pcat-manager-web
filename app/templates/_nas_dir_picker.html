<div x-show="picker.open" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4" @click.self="pickerCancel()">
  <div class="flex max-h-[70vh] w-full max-w-md flex-col rounded-lg bg-white p-5 shadow-xl">
    <h3 class="font-bold text-gray-700">{{locales.picker_title}}</h3>
    <div class="mt-2 flex items-center gap-2 text-sm">
      <button @click="pickerUp()" class="rounded border border-gray-300 px-2 py-1 text-gray-600 hover:bg-gray-50">↑</button>
      <span class="truncate font-mono text-xs text-gray-500" x-text="picker.path || '/'"></span>
    </div>
    <div class="mt-2 flex-1 overflow-y-auto">
      <template x-for="entry in picker.entries" :key="entry.name">
        <button @click="pickerNavigate(entry)" class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-sm text-gray-700 hover:bg-gray-50">
          <span>📁</span><span x-text="entry.name"></span>
        </button>
      </template>
    </div>
    <div class="mt-3 flex justify-end gap-2">
      <button @click="pickerCancel()" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-600">{{locales.shares_btn_cancel}}</button>
      <button @click="pickerSelect()" :disabled="!picker.path" class="rounded bg-pcatblue px-4 py-2 text-sm text-white disabled:opacity-40">{{locales.picker_select}}</button>
    </div>
  </div>
</div>
